<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Eilat Marine Blue -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Golden Sun Gradient for North Needle & Ring -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Deep Gold for Shadowed needle facets -->
    <linearGradient id="goldDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Red Sea Turquoise / Marine Cyan Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="seaDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Glow Filter for the Central Star -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Circular Container (with slight squircle padding safe zone) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Compass Outer Golden-Cyan Accent Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#seaGrad)" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.15"/>

  <!-- Cardinal Markers on Ring -->
  <!-- North Indicator Marker -->
  <polygon points="256,44 266,74 246,74" fill="url(#goldGrad)"/>
  <!-- South Indicator Marker -->
  <circle cx="256" cy="460" r="5" fill="url(#seaGrad)"/>
  <!-- East Indicator Marker -->
  <circle cx="460" cy="256" r="5" fill="url(#goldGrad)"/>
  <!-- West Indicator Marker -->
  <circle cx="52" cy="256" r="5" fill="url(#goldGrad)"/>

  <!-- Subtle Dial Tick Marks -->
  <g stroke="#94a3b8" stroke-width="2" opacity="0.35">
    <line x1="256" y1="58" x2="256" y2="70"/>
    <line x1="256" y1="442" x2="256" y2="454"/>
    <line x1="58" y1="256" x2="70" y2="256"/>
    <line x1="442" y1="256" x2="454" y2="256"/>
    <!-- Diagonals -->
    <line x1="116" y1="116" x2="125" y2="125"/>
    <line x1="396" y1="116" x2="387" y2="125"/>
    <line x1="116" y1="396" x2="125" y2="387"/>
    <line x1="396" y1="396" x2="387" y2="387"/>
  </g>

  <!-- Consensus Wave Arcs (Symbolizing Public Agreement Crossing the Gulf) -->
  <path d="M 120 280 C 180 230, 332 230, 392 280" fill="none" stroke="url(#seaGrad)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 140 295 C 195 255, 317 255, 372 295" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- CENTRAL COMPASS ROSE (8-Pointed Star of Guidance & Consensus) -->
  <g filter="url(#subtleShadow)">
    
    <!-- Secondary (Diagonal) Points -->
    <!-- North-East -->
    <polygon points="256,256 350,162 256,234" fill="url(#goldDarkGrad)" opacity="0.9"/>
    <polygon points="256,256 350,162 278,256" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- North-West -->
    <polygon points="256,256 162,162 234,256" fill="url(#goldGrad)" opacity="0.8"/>
    <polygon points="256,256 162,162 256,234" fill="url(#goldDarkGrad)" opacity="0.9"/>
    <!-- South-East -->
    <polygon points="256,256 350,350 278,256" fill="url(#seaGrad)" opacity="0.8"/>
    <polygon points="256,256 350,350 256,278" fill="url(#seaDarkGrad)" opacity="0.9"/>
    <!-- South-West -->
    <polygon points="256,256 162,350 256,278" fill="url(#seaDarkGrad)" opacity="0.9"/>
    <polygon points="256,256 162,350 234,256" fill="url(#seaGrad)" opacity="0.8"/>

    <!-- Primary Cardinal Needles -->
    
    <!-- SOUTH NEEDLE (Marine Azure Sea) -->
    <polygon points="256,256 256,410 226,256" fill="url(#seaDarkGrad)"/>
    <polygon points="256,256 256,410 286,256" fill="url(#seaGrad)"/>

    <!-- EAST NEEDLE (Golden Sunrise) -->
    <polygon points="256,256 410,256 256,226" fill="url(#goldGrad)"/>
    <polygon points="256,256 410,256 256,286" fill="url(#goldDarkGrad)"/>

    <!-- WEST NEEDLE (Desert Mountains) -->
    <polygon points="256,256 102,256 256,226" fill="url(#goldDarkGrad)"/>
    <polygon points="256,256 102,256 256,286" fill="url(#goldGrad)"/>

    <!-- NORTH NEEDLE (The Guiding Eilat Sun Star - Prominent) -->
    <polygon points="256,256 256,86 226,256" fill="url(#goldDarkGrad)"/>
    <polygon points="256,256 256,86 286,256" fill="url(#goldGrad)"/>
    <polygon points="256,256 256,86 266,246" fill="#fef08a" opacity="0.6"/>

    <!-- Central Civic Hub / Deliberation Node -->
    <circle cx="256" cy="256" r="32" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="256" cy="256" r="20" fill="url(#goldGrad)"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="5" fill="#fef08a"/>
  </g>

  <!-- Glowing Northern Beacon Tip -->
  <circle cx="256" cy="86" r="6" fill="#ffffff" filter="url(#glow)"/>
</svg>
